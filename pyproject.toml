[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-enterprise-rag"
version = "0.1.0"
description = "Production-ready multimodal financial PDF Retrieval-Augmented Generation (RAG) with Critic LLM evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Enterprise AI Engineering Team"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "qdrant",
    "llm-as-a-judge",
    "openai",
    "pymupdf",
    "financial-rag"
]
dependencies = [
    "openai>=1.30.0",
    "qdrant-client>=1.9.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
enterprise-rag = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
